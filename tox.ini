# tox (https://tox.wiki/) runs the test suite on all supported Python and
# Django versions. To use it, "pip install tox" and run "tox" in this directory.
#
# The tests run in a temporary directory, so they test the installed package,
# not the source tree.

[tox]
envlist =
    py{310,311}-django52
    py{312,313,314}-django{52,60,61}
    py315-django61
    flake8

skip_missing_interpreters = true

[testenv]
deps =
    django52: Django>=5.2,<6.0
    django60: Django>=6.0,<6.1
    django61: Django>=6.1,<6.2
changedir = {envtmpdir}
commands = {envpython} -W default::DeprecationWarning -m django test filemanager --settings=filemanager.tests.settings {posargs}

[testenv:flake8]
skip_install = true
changedir = {toxinidir}
deps = flake8
commands = flake8 filemanager

[flake8]
extend-ignore = E501

[gh]
python =
    3.15 = py315-django61
    3.14 = py314-django{52,60,61}
    3.13 = py313-django{52,60,61}, flake8
    3.12 = py312-django{52,60,61}
    3.11 = py311-django52
    3.10 = py310-django52
